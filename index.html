<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<script>
try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('color-scheme') ?? 'light dark'; } catch (e) {}
</script>
<meta name="theme-color" content="#ffe4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1836" media="(prefers-color-scheme: dark)">
<meta name="description" content="樱花日语词典：收录约 19 万词条与 1.3 万汉字，支持假名、汉字、罗马字、英文与变形查词。">
<title>樱花日语词典</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts/zen-maru.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div id="petals"></div></div>

<header class="top">
  <form id="searchForm" class="search" role="search" autocomplete="off">
    <button type="button" id="backBtn" class="icon-btn" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <label class="search-box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" lang="ja"
             placeholder="输入日语、罗马字或英文…" aria-label="查词"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" id="clearBtn" class="clear" aria-label="清空" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </label>
    <span id="buddySay" class="buddy-say" role="status"></span>
    <button type="button" id="buddy" class="buddy" aria-label="吉祥物，点一下听她说话" hidden><span id="buddyFace"></span></button>
  </form>
  <div id="loadbar" class="loadbar" role="progressbar" aria-label="词库加载进度" aria-valuemin="0" aria-valuemax="100">
    <i></i><span id="loadtext">正在准备词库…</span>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="主导航">
  <a href="#/" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <span>查词</span>
  </a>
  <a href="#/kanji" data-tab="kanji"><b lang="ja" aria-hidden="true">字</b><span>汉字</span></a>
  <a href="#/kana" data-tab="kana"><b lang="ja" aria-hidden="true">あ</b><span>五十音</span></a>
  <a href="#/fav" data-tab="fav">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.8z"/></svg>
    <span>生词本</span>
  </a>
  <a href="#/me" data-tab="me">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1-4 4-5.5 7.5-5.5s6.500 1.5 7.500 5.500"/></svg>
    <span>设置</span>
  </a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/jp.js"></script>
<script src="js/tags.js"></script>
<script src="js/live.js"></script>
<script src="js/mascot.js"></script>
<script src="js/app.js"></script>
</body>
</html>
